name: Testes BDD - API ESG

# Sobe a API real com o banco Oracle e executa todos os cenarios Gherkin contra ela.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-bdd:
    name: Cucumber + RestAssured + JSON Schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: tests-bdd/pom.xml

      - name: Subir API e Oracle (docker compose)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 600
          docker compose ps

      - name: Executar os testes BDD
        run: bash tests-bdd/scripts/executar-testes.sh http://localhost:8080

      - name: Publicar resumo na pagina da execucao
        if: always()
        run: python3 tests-bdd/scripts/resumo_ci.py >> "$GITHUB_STEP_SUMMARY"

      - name: Coletar logs dos containers
        if: always()
        run: docker compose logs --no-color > tests-bdd/target/containers.log 2>&1 || true

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-bdd
          path: |
            tests-bdd/target/cucumber-reports/
            tests-bdd/target/surefire-reports/
            tests-bdd/target/containers.log
          retention-days: 30

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
